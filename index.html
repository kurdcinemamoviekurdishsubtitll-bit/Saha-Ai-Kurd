<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurd-AI | زیرەکی دەستکرد</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #131314; color: #e3e3e3; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e1f20; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; border-bottom: 1px solid #333; color: #a8c7fa; }
        #chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; max-width: 800px; width: 100%; margin: 0 auto; box-sizing: border-box; }
        .message { padding: 12px 18px; border-radius: 12px; max-width: 80%; line-height: 1.6; font-size: 15px; word-wrap: break-word; }
        .user { background: #0b57d0; color: white; align-self: flex-start; }
        .ai { background: #282a2c; color: #e3e3e3; align-self: flex-end; border: 1px solid #3c4043; }
        #input-area { display: flex; padding: 15px; background: #1e1f20; border-top: 1px solid #333; gap: 10px; max-width: 800px; width: 100%; margin: 0 auto; box-sizing: border-box; }
        input { flex: 1; padding: 12px 18px; border: 1px solid #444; border-radius: 25px; background: #131314; color: white; outline: none; font-size: 15px; }
        input:focus { border-color: #a8c7fa; }
        button { background: #a8c7fa; color: #001d35; border: none; padding: 0 20px; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 15px; }
        button:hover { background: #d3e3fd; }
        .loading { color: #8e918f; font-style: italic; }
    </style>
</head>
<body>

    <header>✨ Kurd-AI | زیرەکی دەستکردی کوردی</header>

    <div id="chat-container">
        <div class="message ai">سڵاو! من زیرەکییەکی دەستکردم. چۆن دەتوانم یارمەتیت بدەم؟</div>
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="پرسیارەکەت لێرە بنووسە..." onkeypress="if(event.key === 'Enter') sendToAI()">
        <button onclick="sendToAI()">ناردن</button>
    </div>

    <script>
        // لێرە کلیلی نوێی خۆت دابنە
        const API_KEY = "AQ.Ab8RN6I9_p6POPGanrR3jMkhDnv3Ex13ZxKdD0CCzSqrnOBEiQ";

        async function sendToAI() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-container");
            const text = inputField.value.trim();
            if (!text) return;

            chatBox.innerHTML += `<div class="message user">${escapeHtml(text)}</div>`;
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = "load-" + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="message ai loading">خەریکە بیر دەکاتەوە...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: "تۆ زیرەکییەکی دەستکردی پێشکەوتووی، بە زمانی کوردی سۆرانی ڕەوان و وەک چاتجیپتی وەڵام بدەرەوە بۆ ئەمە: " + text }]
                        }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    chatBox.innerHTML += `<div class="message ai">${escapeHtml(reply).replace(/\n/g, '<br>')}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="message ai">ببوورە، هەڵەیەک ڕوویدا لە وەڵامدانەوەدا.</div>`;
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="message ai">کێشەی پەیوەندی هەیە.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
